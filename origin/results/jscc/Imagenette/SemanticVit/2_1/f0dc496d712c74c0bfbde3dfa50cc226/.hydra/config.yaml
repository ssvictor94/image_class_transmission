    encoder:
      _target_: comm.pipeline.BaseRealToComplexNN
      output_size: 0.25
      n_layers: 3
      normalize: true
      drop_last_activation: true
    decoder:
      _target_: comm.pipeline.ConcatComplexToRealNN
      n_layers: 3
  gaussian_no_training_01:
    splitting_point: 6
