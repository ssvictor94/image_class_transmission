hydra:
  run:
    dir: ${core.results_path}/${get_path:}/${to_hash:}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(filename)s][%(levelname)s] - %(message)s'
      longer:
        format: '[%(asctime)s][%(filename)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: longer
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
        mode: w
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - training_pipeline=imagenette224_vit16
    - pretraining_pipeline=imagenette224
    - model=deit_tiny_patch16_224
    - +jscc=proposal
    - method=proposal
    - method.loss.inner_flops_type=margin
    - method.loss.inner_flops_w=1
    - method.loss.output_flops_w=2
    - final_evaluation=semantic
    - +method.model.blocks_to_transform=6
    - comm_evaluation=semantic
    - serialization.values_to_prepend=[jscc]
    - device=0
  job:
    name: main
    chdir: false
    override_dirname: +jscc=proposal__+method.model.blocks_to_transform=6__comm_evaluation=semantic__final_evaluation=semantic__method.loss.inner_flops_type=margin__method.loss.inner_flops_w=1__method.loss.output_flops_w=2__method=proposal__model=deit_tiny_patch16_224__pretraining_pipeline=imagenette224__serialization.values_to_prepend=[jscc]__training_pipeline=imagenette224_vit16
    id: ???
    num: ???
    config_name: default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: __
        exclude_keys:
        - device
        - enable_wandb
        - wandb_tags
        - plot
  runtime:
    version: 1.3.2
    version_base: '1.2'
    cwd: C:\Users\hp\Documents\djscc_image_class
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\hp\Documents\djscc_image_class\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: C:\Users\hp\Documents\djscc_image_class\results\jscc\Imagenette\SemanticVit\2_1\f0dc496d712c74c0bfbde3dfa50cc226
    choices:
      jscc: proposal
      comm_evaluation: semantic
      serialization: default
      final_evaluation: semantic
      method: proposal
      training_schema: null
      pretraining_pipeline: imagenette224
      training_pipeline: imagenette224_vit16
      training_pipeline/scheduler: cosine
      training_pipeline/dataset: imagenette
      training_pipeline/schema: default
      training_pipeline/dataloader: bs_128
      training_pipeline/augmentation: imagenette_224
      training_pipeline/optimizer: adam
      model: deit_tiny_patch16_224
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
